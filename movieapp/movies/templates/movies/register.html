<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #702CF5; color: white;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="bg-dark text-white p-4 rounded mt-5">
                    <h1>Create an Account</h1>
                    {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Please fix the highlighted registration errors and try again.
                    </div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Username:</label>
                            <input type="text" id="username" name="username" class="form-control form-control-lg" value="{{ form.username.value|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" id="email" name="email" class="form-control form-control-lg" value="{{ form.email.value|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="password1" class="form-label">Password:</label>
                            <input type="password" id="password1" name="password1" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirm Password:</label>
                            <input type="password" id="password2" name="password2" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                    <p>Already have an account? <a href="{% url 'login' %}" class="text-white">Login here</a>.</p>
                    {% if registration_success %}
                    <p>Registration successful! You can now <a href="{% url 'menu' %}" class="text-white">go to the menu</a>.</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
